name: Collect NBA props
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 0-5,19-23 * * *'
permissions:
  contents: write
concurrency:
  group: nba-prop-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: vars.ENABLE_LIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - uses: actions/cache@v4
        with:
          path: |
            state/boxes-v2.json
            state/schedule.json
          key: nba-data-v2-${{ github.run_id }}
          restore-keys: nba-data-v2-
      - run: npm run refresh
      - run: npm run check
      - name: Save board and quotes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/board.json public/data/picks.json state/quotes.json
          if ! git diff --cached --quiet; then
            git commit -m "Update NBA prop snapshots"
            git push
          fi
      - name: Trigger Vercel
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl --silent --show-error --fail -X POST "$DEPLOY_HOOK" > /dev/null
          fi
